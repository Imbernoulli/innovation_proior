# Agentic ablation 4B — arm WITH agentic slice (innov_withag = noag + 473 agentic rows)
# Recipe mirrors the 9B exploration line; sized for 2x80G GPUs (1 x 64 x 2 = effective batch 128).
# Requires the patched fork /srv/home/bohanlyu/LF-innov (branch feat/per-turn-loss-mask, >= 494ff82).

### model
model_name_or_path: Qwen/Qwen3.5-4B
trust_remote_code: true
enable_liger_kernel: true   # fused linear CE — required: 53760 tok x 248K vocab logits would need ~75G/GPU in plain CE
flash_attn: auto   # auto→fa2 when the low-pri compile lands, sdpa otherwise (all-accel ruling)

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0
deepspeed: /srv/home/bohanlyu/innovation_proior/experiments/agentic_ablation_4b/ds_z3_offload_optimizer.json  # ZeRO-3 + optimizer CPU offload (Adam states ~25G/rank exceed 80G at cutoff 53760)

### dataset
dataset: innov_v2,maintain_w2w3
template: qwen3_5
enable_thinking: true
mask_history: false            # per-turn `loss` flags in the data do the folding
cutoff_len: 53760
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 2

### output
output_dir: /srv/home/bohanlyu/models_sft/v2_multisetting_4b/lora_r32
logging_steps: 1
save_steps: 11                 # ~1/6 epoch (steps/epoch ~= 68 = (2622+6041)/128)
save_strategy: steps
save_only_model: true          # weight-only ckpts (for later RL-start selection); ZeRO-3 optim states would be ~48G/ckpt
plot_loss: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42
